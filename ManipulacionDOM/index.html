<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Davinson cañas</h1>
        </header>
        <main>
            <div class="cuadro">
                <div>
                    <label for="compra">Ingrese Monto Cuenta</label>
                    <input type="number" id="compra" placeholder="ingrese valor"><br>
                    <label for="Iva">Ingrese Valor Iva</label>
                    <input type="number" id="Iva" placeholder="Ingrese el Valor del Iva">
                    <button onclick="calcularIva()">TOTAL</button>
                    <h1 id="resultadoTotal">total: </h1>
                </div>
            </div>
            <div class="cuadro">
                <div>
                    <label for="cuadrado">Ingresa area</label>
                    <input type="number" id="cuadrado" placeholder="Ingresa area del cuadrado"> <br>
                    <button onclick="calcularCuadrado()">Calcular</button>
                    <h1 id="resultadoArea"></h1>
                    <h1 id="resultadoPerimetro"></h1>
                </div>

            </div>
            <div class="cuadro">
                <div>
                    <label for="Digito"> Ingresa el numero de 2 Digitos</label>
                    <input type="number" id="Digito" placeholder="Numero de 2 Digitos">
                    <button onclick="numeroDosDigitos()">Enviar</button>
                    <h1 id="resDecenas"></h1>
                    <h1 id="resUnidades"></h1>
                </div>

            </div>
            <div class="cuadro">

                <div>
                    <label for="comensales">Ingresa comensales</label>
                    <input type="number" id="comensales" placeholder="Numero de comensales">
                    <button onclick="calcularIngredientes()">Calcular Receta</button>
                    <h1 id="resPapas"></h1>
                    <h1 id="resHuevos"></h1>
                    <h1 id="resCebolla"></h1>

                </div>
            </div>
            <div class="cuadro">contenido 5</div>
            <div class="cuadro">contenido 6</div>
            <div class="cuadro">
                <div>
                    <h3>¿Cual es Mayor?</h3>
                    <label for="numA">Ingresa Numero 1</label>
                    <input type="number" id="numA" placeholder="Numero 1">
                     <label for="numB">Ingresa Numero 2</label>
                     <input type="number" id="numB" placeholder="Numero 2">
                     <button onclick="compararNumeros()">Comparar</button>
                     <h2 id="resComparacion"></h2>

                </div>

            </div>
            <div class="cuadro">
                <div>
                    <h3>Factorial</h3>
                    <label for="factorial">Ingresa un Numero</label>
                    <input type="number" id="factorial" placeholder="ingresa un numero">
                    <button onclick="calcularFactorial()">Calcular !</button>
                    <h3 id="resFactorial"></h3>
                </div>
            </div>
            <div class="cuadro">
                <div>
                    <h3>Multiplos de 6</h3>
                    <label for="rangoInicio">Inicio</label>
                    <input type="number" id="rangoInicio" placeholder="Inicio"><br>
                    <label for="rangoFin">Final</label>
                    <input type="number" id="rangoFin" placeholder="Final"><br>
                    <button onclick="buscarMultiplos()">Mostrar Multiplos</button>

                    <h3 id="resMultiplos"></h3>
                </div>
            </div>
            <div class="cuadcro">contenido 10</div>
            <div class="cuadro">contenido 11</div>
            <div class="cuadro">contenido 12</div>
            <div class="cuadro">contenido 13</div>
            <div class="cuadro">contenido 14</div>
            <div class="cuadro">contenido 15</div>
        </main>
        <footer></footer>




        <script src="Funciones.js"></script> 
    </div>
    
</body>
</html>
